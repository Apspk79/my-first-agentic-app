<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Support & Knowledge Base Assistant</title>
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Material Symbols for icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --chip-bg: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border: #334155;
    --chip-bg: #1e293b;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* Header Layout */
  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .header-avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .header-title-group {
    display: flex;
    flex-direction: column;
  }
  .header-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .header-subtitle {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 0.15rem;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .theme-toggle {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 1.1rem;
  }
  .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.35);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.18);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }

  /* Chat Log & Message Containers */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeInUp 0.25s ease-out forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .msg-avatar { background: #64748b; }

  .bubble-container {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg.user .bubble-container { align-items: flex-end; }

  .bubble {
    position: relative;
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.agent .bubble { border-bottom-left-radius: 4px; }
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; max-width: 100%; white-space: normal; }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    color: var(--text-secondary);
    padding: 0 0.2rem;
  }
  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 0.72rem;
    transition: color 0.2s ease;
  }
  .copy-btn:hover { color: var(--accent); }

  /* Animated Typing Indicator */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.6rem;
  }
  .typing-dots span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Clickable Example Prompt Chips */
  .examples-wrapper {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 0.25rem;
  }
  .examples-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 0.4rem;
  }
  .examples-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .example-chip {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.84rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
  }
  .example-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* Input Form Footer */
  .form-container {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem 1.25rem;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  form {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 0.75rem;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
    color: var(--text-primary);
  }
  input:focus {
    background: var(--card-bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  button[type="submit"] {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-sm);
  }
  button[type="submit"]:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* --- A2UI Component Design System (v0.8) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    color: var(--text-primary);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-avatar">🤖</div>
    <div class="header-title-group">
      <span class="header-title">IT Support & Knowledge Base Assistant</span>
      <span class="header-subtitle">Virtual Helpdesk Assistant</span>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="examples-wrapper">
  <div class="examples-title">Suggested Requests</div>
  <div class="examples-row">
    <button type="button" class="example-chip" onclick="sendExample('Check system operational status')">💡 Check system status</button>
    <button type="button" class="example-chip" onclick="sendExample('Search knowledge base for VPN setup')">🔍 Search VPN setup</button>
    <button type="button" class="example-chip" onclick="sendExample('Generate IT diagram for network topology')">🎨 Generate IT diagram</button>
  </div>
</div>

<div class="form-container">
  <form id="form">
    <input id="input" placeholder="Type your IT support question or issue..." autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeToggleBtn = document.getElementById("themeToggleBtn");

/* --- Feature 2: Dark/Light Mode Toggle --- */
function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  themeToggleBtn.textContent = saved === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", current);
  localStorage.setItem("theme", current);
  themeToggleBtn.textContent = current === "dark" ? "☀️" : "🌙";
}
initTheme();

function getTimeStr() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function sendExample(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* --- Feature 3: Copy Text & Timestamp Meta --- */
function copyText(txt, btn) {
  navigator.clipboard.writeText(txt).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Copied';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

function bubble(who, isTyping = false) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "msg-avatar", who === "user" ? "👤" : "🤖");
  const container = el("div", "bubble-container");
  const b = el("div", "bubble");

  if (isTyping) {
    b.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  }

  container.appendChild(b);

  if (!isTyping) {
    const meta = el("div", "msg-meta");
    meta.appendChild(el("span", null, getTimeStr()));
    container.appendChild(meta);
  }

  m.appendChild(avatar);
  m.appendChild(container);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return { bubble: b, container: container };
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(target, parts) {
  const b = target.bubble;
  const container = target.container;
  b.textContent = "";

  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";

  // Attach metadata + copy button
  const meta = el("div", "msg-meta");
  meta.appendChild(el("span", null, getTimeStr()));
  if (textStr) {
    const btn = el("button", "copy-btn", "📋 Copy");
    btn.onclick = () => copyText(textStr, btn);
    meta.appendChild(btn);
  }
  container.appendChild(meta);

  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";

  /* Feature 1: Animated Typing Loader */
  const agentTarget = bubble("agent", true);

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(agentTarget, data.parts || []);
  } catch (e) {
    renderReply(agentTarget, [{ kind: "text", text: "Error: " + e.message }]);
  }
});
</script>
</body>
</html>
